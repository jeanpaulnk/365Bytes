name: Exchange Team Blog summaries
on:
  schedule:
    - cron: '41 */3 * * *'   # every 3 hours
  workflow_dispatch:
  repository_dispatch:
    types: [exchange-blog]
permissions:
  contents: write   # commit new posts
  actions: write    # start the Deploy docs workflow
concurrency:
  group: exchange-blog
  cancel-in-progress: false
jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install GitHub Copilot CLI (only when the token secret exists)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then npm install -g @github/copilot; else echo "No COPILOT_GITHUB_TOKEN secret: skipping"; fi
      - id: run
        run: python scripts/exchange_blog.py
        env:
          # Summaries by GitHub Copilot (any plan, including Free): fine-grained PAT with "Copilot Requests".
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TEST_SUMMARY: ${{ github.event.client_payload.test }}
          REWRITE_EXISTING: ${{ github.event.client_payload.rewrite }}
          # Backup when Copilot fails: DeepSeek-V3 on SiliconFlow's free tier.
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          # Optional AI review. Leave unset to use keyword rules.
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/Bytes-from-Exchange-Team-Blog data/exchange-blog-state.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Exchange Team Blog: ${{ steps.run.outputs.posted || 0 }} new summary(ies)"
          git push
          # Pushes made with GITHUB_TOKEN do not start other workflows, so start the deploy explicitly.
          if [ "${{ steps.run.outputs.posted || 0 }}" != "0" ]; then gh workflow run docs.yml --ref main; fi
