name: Deploy docs
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # refresh Message Center posts every 3 hours
  pull_request:   # build-only check, never deploys
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-docs]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the Microsoft Graph federated credential
      issues: write     # open/close the "a source is failing" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --site-dir site
      - id: archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mc-archive
          key: mc-archive-${{ github.run_id }}
          restore-keys: mc-archive-
      - run: python scripts/build_mc_data.py site/mc-data
        env:
          # Optional: read Message Center posts from Microsoft Graph through
          # the GitHub OIDC federated credential (no client secret). Unset = archive only.
          # Kept as secrets so the identifiers are masked in logs; MC_REDACT is a comma
          # separated list of extra terms (tenant names) scrubbed from the published data.
          # MC_TENANTS = "tenant[:clientId],..." for several tenants (first = primary).
          # Pull-request builds get none of these, so they only ever use the public sources.
          MC_ARCHIVE: mc-archive/archive.json.gz
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
          MC_TENANTS: ${{ github.event_name != 'pull_request' && secrets.MC_TENANTS || '' }}
          MC_TENANT_ID: ${{ github.event_name != 'pull_request' && secrets.MC_TENANT_ID || '' }}
          MC_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.MC_CLIENT_ID || '' }}
          MC_REDACT: ${{ github.event_name != 'pull_request' && secrets.MC_REDACT || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mc-archive
          key: mc-archive-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
