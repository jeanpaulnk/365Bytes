name: Deploy docs
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # refresh Message Center posts every 3 hours
  pull_request:   # build-only check, never deploys
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-docs]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --site-dir site
      - run: python scripts/build_mc_data.py site/mc-data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
