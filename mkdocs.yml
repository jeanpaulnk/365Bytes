site_name: 365Bytes
site_url: https://jeanpaulnk.github.io/365Bytes/
site_description: 'Hands-on lab notes on Exchange Online, Outlook, Security & Compliance and Cloud identity'
repo_url: https://github.com/jeanpaulnk/365Bytes
edit_uri: edit/main/docs/
copyright: 'Content &copy; 2026 Jean Paul Nkundabose, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Code: MIT. Summaries of Microsoft articles and Message Center content belong to Microsoft.'
docs_dir: docs

not_in_nav: |
  /Message-Center/post.md
  /404.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  icon:
    admonition:
      note: octicons/tag-16
      info: octicons/info-16
      success: octicons/check-16
      bug: octicons/bug-16
      warning: octicons/alert-16

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/message-center.js

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jeanpaulnkundabose/
      name: LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Paulnkundabose
      name: X (@Paulnkundabose)
    - icon: fontawesome/brands/microsoft
      link: https://learn.microsoft.com/en-au/users/jeanpaulnkundabose/
      name: Microsoft Learn
    - icon: fontawesome/solid/rss
      link: https://jeanpaulnk.github.io/365Bytes/feed_rss_created.xml
      name: Subscribe via RSS

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - rss:
      match_path: '(?!Message-Center/|Bytes-from-[^/]+/index).+/.+'
      feed_title: '365Bytes'
      length: 50
