extra: {social: [{icon: fontawesome/brands/linkedin, link: 'https://www.linkedin.com/in/jeanpaulnkundabose/', name: LinkedIn}, {icon: fontawesome/brands/x-twitter, link: 'https://x.com/Paulnkundabose', name: X (@Paulnkundabose)}, {icon: fontawesome/brands/microsoft, link: 'https://learn.microsoft.com/en-au/users/jeanpaulnkundabose/', name: Microsoft Learn}, {icon: fontawesome/solid/rss, link: 'https://jeanpaulnk.github.io/JPN365Labs/feed_rss_created.xml', name: Subscribe via RSS}]}
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/message-center.js]
site_url: https://jeanpaulnk.github.io/JPN365Labs/
repo_url: https://github.com/jeanpaulnk/JPN365Labs
site_name: 'JPN365Labs'
site_description: 'Hands-on lab notes on Exchange Online, Outlook, Security & Compliance and Cloud identity'
edit_uri: edit/main/docs/
docs_dir: 'docs'
not_in_nav: |
  /Message-Center/post.md
theme:
  name: 'material'
  custom_dir: overrides
  features:
    - navigation.indexes
    - content.action.edit
    - content.code.copy
  icon:
    admonition:
      note: octicons/tag-16
      info: octicons/info-16
      success: octicons/check-16
      bug: octicons/bug-16
      warning: octicons/alert-16
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - rss:
      match_path: '(?!Message-Center/|Exchange-Team-Blog/index).+/.+'
      feed_title: 'JPN365Labs'
      length: 50
